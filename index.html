<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Friendship Day ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #05020a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* 1. PINK DIGITAL RAIN CANVAS */
    #pinkRainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* CONTAINER STYLING */
    .container {
      position: relative;
      z-index: 10;
      width: 95%;
      max-width: 950px;
      text-align: center;
      background: rgba(18, 5, 25, 0.88);
      backdrop-filter: blur(14px);
      padding: 30px 20px;
      border-radius: 28px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.25);
      margin: 20px 0;
    }

    /* PAGE 1 */
    #page1 h1 {
      font-size: 2.8rem;
      color: #f472b6;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.8), 0 0 30px rgba(236, 72, 153, 0.4);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    #page1 p.sub-text {
      font-size: 1.4rem;
      color: #fbcfe8;
      text-shadow: 0 0 8px rgba(251, 207, 232, 0.5);
      margin-bottom: 70px;
    }

    /* BUTTON ZONE */
    .button-zone {
      position: relative;
      width: 100%;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .btn {
      padding: 14px 40px;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
    }

    #yesBtn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: white;
      z-index: 5;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.8);
    }

    #noBtn {
      position: absolute;
      background: #334155;
      color: #94a3b8;
      z-index: 10;
      transition: left 0.15s ease-out, top 0.15s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* PAGE 2 */
    #page2 {
      display: none;
      max-height: 90vh;
      overflow-y: auto;
    }

    .quote-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f472b6;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 15px;
      color: #fbcfe8;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.4;
    }

    /* CIRCULAR STAGE LAYOUT */
    .circle-stage {
      position: relative;
      width: 100%;
      height: 620px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    /* CENTER WISH CARD */
    .center-wish-card {
      position: absolute;
      z-index: 5;
      width: 260px;
      height: 260px;
      background: rgba(244, 114, 182, 0.12);
      border: 2px solid rgba(244, 114, 182, 0.5);
      border-radius: 50%;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.3), inset 0 0 20px rgba(236, 72, 153, 0.2);
      backdrop-filter: blur(8px);
    }

    .main-wish {
      font-size: 1.8rem;
      color: #f472b6;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.9), 0 0 25px rgba(236, 72, 153, 0.6);
      line-height: 1.3;
    }

    /* CIRCLE PHOTO SLOTS */
    .slot-item {
      position: absolute;
      width: 150px;
      height: 180px;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      z-index: 10;
    }

    /* UPLOADED PHOTO CARD */
    .photo-card {
      background: rgba(30, 20, 40, 0.92);
      border-radius: 16px;
      padding: 8px;
      border: 1px solid rgba(244, 114, 182, 0.5);
      box-shadow: 0 4px 18px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .photo-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .photo-card .caption {
      color: #fbcfe8;
      font-size: 0.72rem;
      line-height: 1.2;
      font-style: italic;
      text-align: center;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    /* PLUS (+) ICON TILE */
    .add-slot-card {
      background: rgba(244, 114, 182, 0.08);
      border: 2px dashed #f472b6;
      border-radius: 16px;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(244, 114, 182, 0.15);
    }

    .add-slot-card:hover {
      background: rgba(244, 114, 182, 0.22);
      transform: scale(1.05);
      border-color: #ec4899;
    }

    .plus-icon {
      font-size: 2.8rem;
      color: #f472b6;
      line-height: 1;
      user-select: none;
      text-shadow: 0 0 12px rgba(244, 114, 182, 0.8);
    }

    @media (max-width: 600px) {
      .circle-stage {
        height: 500px;
      }
      .center-wish-card {
        width: 190px;
        height: 190px;
      }
      .main-wish {
        font-size: 1.3rem;
      }
      .slot-item {
        width: 110px;
        height: 135px;
      }
      .photo-card img {
        height: 75px;
      }
      .photo-card .caption {
        font-size: 0.62rem;
      }
      .plus-icon {
        font-size: 2.2rem;
      }
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="pinkRainCanvas"></canvas>

  <div class="container">
    <!-- PAGE 1 -->
    <div id="page1">
      <h1>Happy Friendship Day</h1>
      <p class="sub-text">Will you be my friend forever?</p>

      <div class="button-zone" id="btnZone">
        <button class="btn" id="yesBtn" onclick="goToPage2()">YES! ❤️</button>
        <button class="btn" id="noBtn">NO 😜</button>
      </div>
    </div>

    <!-- PAGE 2 -->
    <div id="page2">
      <!-- QUOTE BOX -->
      <div class="quote-box">
        "Friendship is not about who you've known the longest... It's about who came into your life, said 'I'm here for you,' and proved it." ✨
      </div>

      <!-- HIDDEN FILE INPUT -->
      <input type="file" id="fileInput" accept="image/*" onchange="uploadToSlot(event)" />

      <!-- CIRCLE STAGE (PHOTOS SURROUNDING WISH IN A CIRCLE) -->
      <div class="circle-stage" id="circleStage">
        <!-- CENTER WISH HEADER -->
        <div class="center-wish-card">
          <h1 class="main-wish">Happy Friendship Day! 💖</h1>
        </div>

        <!-- 5 CIRCLE SLOTS -->
        <div class="slot-item" id="slot-0"></div>
        <div class="slot-item" id="slot-1"></div>
        <div class="slot-item" id="slot-2"></div>
        <div class="slot-item" id="slot-3"></div>
        <div class="slot-item" id="slot-4"></div>
      </div>
    </div>
  </div>

  <script>
    /* CLEAR PREVIOUS LOCALSTORAGE ON RELOAD */
    localStorage.removeItem('friendship_circle_orbit_data');

    /* 1. PINK RAIN MATRIX ANIMATION */
    const canvas = document.getElementById('pinkRainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const pinkChars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ💕✨🌸💖';
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function drawPinkRain() {
      ctx.fillStyle = 'rgba(5, 2, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f472b6';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = pinkChars.charAt(Math.floor(Math.random() * pinkChars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawPinkRain, 33);

    window.addEventListener('resize', () => {
      resizeCanvas();
      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
      positionSlotsInCircle();
    });

    /* 2. DODGE LOGIC FOR NO BUTTON */
    const noBtn = document.getElementById('noBtn');
    const btnZone = document.getElementById('btnZone');

    function resetNoPosition() {
      noBtn.style.left = `calc(50% + 100px)`;
      noBtn.style.top = `20px`;
    }
    resetNoPosition();

    function moveNoBtnAway() {
      const zoneRect = btnZone.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = Math.max(0, zoneRect.width - btnRect.width);
      const maxY = Math.max(0, zoneRect.height - btnRect.height);

      let newX = Math.random() * maxX;
      let newY = Math.random() * maxY;

      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    }

    noBtn.addEventListener('mouseenter', moveNoBtnAway);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoBtnAway();
    });

    /* 3. NAVIGATION & CONFETTI */
    function goToPage2() {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';

      confetti({
        particleCount: 160,
        spread: 90,
        origin: { y: 0.5 },
        colors: ['#f472b6', '#ec4899', '#ffffff']
      });

      positionSlotsInCircle();
      renderSlots();
    }

    /* 4. CIRCULAR ORBIT CALCULATIONS */
    function positionSlotsInCircle() {
      const stage = document.getElementById('circleStage');
      if (!stage) return;

      const stageWidth = stage.clientWidth;
      const stageHeight = stage.clientHeight;
      const centerX = stageWidth / 2;
      const centerY = stageHeight / 2;

      // Adjust radius depending on screen width
      const radius = window.innerWidth <= 600 ? 170 : 230;
      const totalSlots = 5;

      // Start from top angle (-90 deg in radians)
      const startAngle = -Math.PI / 2;

      for (let i = 0; i < totalSlots; i++) {
        const angle = startAngle + (i * (2 * Math.PI / totalSlots));
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        const slotElem = document.getElementById(`slot-${i}`);
        if (slotElem) {
          slotElem.style.left = `${x}px`;
          slotElem.style.top = `${y}px`;
        }
      }
    }

    /* 5. PHOTO SLOT MANAGEMENT */
    let activeSlotIndex = null;
    const photoCaptions = [
      "\"In the story of my life, having you as a friend is my absolute favorite chapter.\" ✨",
      "\"True friendship isn't about being inseparable—it's knowing nothing changes even when life gets busy.\" 💖",
      "\"Through every high and low, thank you for being my constant light and strength.\" 🌸",
      "\"Good times become unforgettable memories simply because you are there to share them.\" 🥳",
      "\"Here's to forever being each other's person. Happy Friendship Day!\" 🎉"
    ];

    function openPicker(index) {
      activeSlotIndex = index;
      document.getElementById('fileInput').click();
    }

    async function uploadToSlot(event) {
      const file = event.target.files[0];
      if (!file || activeSlotIndex === null) return;

      let slots = JSON.parse(localStorage.getItem('friendship_circle_orbit_data') || '[]');
      
      const base64 = await readFileAsDataURL(file);
      slots[activeSlotIndex] = {
        imgSrc: base64,
        caption: photoCaptions[activeSlotIndex] || "Special Memory ✨"
      };

      localStorage.setItem('friendship_circle_orbit_data', JSON.stringify(slots));
      renderSlots();
      event.target.value = '';
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
      });
    }

    function renderSlots() {
      let slots = JSON.parse(localStorage.getItem('friendship_circle_orbit_data') || '[]');

      for (let i = 0; i < 5; i++) {
        const slotElem = document.getElementById(`slot-${i}`);
        if (!slotElem) continue;

        if (slots[i] && slots[i].imgSrc) {
          // Permanently locked uploaded image
          slotElem.innerHTML = `
            <div class="photo-card">
              <img src="${slots[i].imgSrc}" alt="Friendship Memory" />
              <p class="caption">${slots[i].caption}</p>
            </div>
          `;
        } else {
          // Plus (+) icon tile
          slotElem.innerHTML = `
            <div class="add-slot-card" onclick="openPicker(${i})">
              <span class="plus-icon">+</span>
            </div>
          `;
        }
      }
    }
  </script>
</body>
</html>
