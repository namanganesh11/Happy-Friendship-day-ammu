<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Friendship Day Gonzo,Ammu ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #05020a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* PINK DIGITAL RAIN CANVAS */
    #pinkRainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* CONTAINER STYLING */
    .container {
      position: relative;
      z-index: 10;
      width: 95%;
      max-width: 950px;
      text-align: center;
      background: rgba(18, 5, 25, 0.88);
      backdrop-filter: blur(14px);
      padding: 30px 15px;
      border-radius: 24px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.25);
      margin: 20px 0;
    }

    /* PAGE 1: FRONT QUESTION SCREEN */
    #page1 h1 {
      font-size: 2.8rem;
      color: #f472b6;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.8), 0 0 30px rgba(236, 72, 153, 0.4);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    #page1 p.sub-text {
      font-size: 1.4rem;
      color: #fbcfe8;
      text-shadow: 0 0 8px rgba(251, 207, 232, 0.5);
      margin-bottom: 70px;
    }

    /* BUTTON ZONE */
    .button-zone {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .btn {
      padding: 14px 40px;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      user-select: none;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
      touch-action: manipulation;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: white;
      z-index: 5;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.8);
    }

    #noBtn {
      position: absolute;
      background: #334155;
      color: #94a3b8;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      will-change: transform;
    }

    /* PAGE 2 LAYOUT */
    #page2 {
      display: none;
    }

    .quote-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f472b6;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 15px;
      color: #fbcfe8;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.4;
    }

    /* CIRCULAR CONTAINER AROUND THE WISH */
    .circle-wrapper {
      position: relative;
      width: 580px;
      height: 580px;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CENTER WISH TEXT */
    .center-wish {
      width: 260px;
      font-size: 2.1rem;
      color: #f472b6;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.9), 0 0 35px rgba(236, 72, 153, 0.6);
      z-index: 2;
      line-height: 1.25;
    }

    /* PHOTO SLOTS POSITIONED IN A CIRCLE */
    .photo-slot {
      position: absolute;
      width: 140px;
      height: 140px;
      background: rgba(30, 20, 40, 0.9);
      border-radius: 50%;
      padding: 8px;
      border: 2px solid rgba(244, 114, 182, 0.4);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    /* 5 Slots Circular Coordinates */
    .slot-0 { top: 0px; left: 50%; transform: translateX(-50%); }                   /* Top Center */
    .slot-1 { top: 155px; right: 10px; }                                            /* Top Right */
    .slot-2 { bottom: 50px; right: 80px; }                                          /* Bottom Right */
    .slot-3 { bottom: 50px; left: 80px; }                                           /* Bottom Left */
    .slot-4 { top: 155px; left: 10px; }                                             /* Top Left */

    /* DISPLAYED LOCKED IMAGE */
    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .photo-slot img:hover {
      transform: scale(1.08);
    }

    /* LIGHTBOX MODAL FOR FULLSCREEN IMAGE VIEW */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 2, 10, 0.92);
      backdrop-filter: blur(14px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-tag {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f472b6;
      text-shadow: 0 0 12px rgba(244, 114, 182, 0.8);
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 20px;
      border-radius: 30px;
      border: 1px solid rgba(244, 114, 182, 0.4);
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 16px;
      border: 2px solid rgba(244, 114, 182, 0.6);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.5);
      object-fit: contain;
    }

    .close-lightbox {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 40px;
      height: 40px;
      background: #ec4899;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.8);
      transition: transform 0.2s ease;
    }

    .close-lightbox:hover {
      transform: scale(1.15);
    }

    /* RESPONSIVE SCALING FOR MOBILE SCREENS */
    @media (max-width: 620px) {
      .circle-wrapper {
        width: 340px;
        height: 340px;
      }
      .center-wish {
        width: 160px;
        font-size: 1.3rem;
      }
      .photo-slot {
        width: 85px;
        height: 85px;
      }
      .slot-0 { top: 0px; }
      .slot-1 { top: 90px; right: -5px; }
      .slot-2 { bottom: 25px; right: 35px; }
      .slot-3 { bottom: 25px; left: 35px; }
      .slot-4 { top: 90px; left: -5px; }
    }
  </style>
</head>
<body>

  <!-- PINK DIGITAL RAIN CANVAS -->
  <canvas id="pinkRainCanvas"></canvas>

  <div class="container">
    <!-- PAGE 1 -->
    <div id="page1">
      <h1>Happy Friendship Day</h1>
      <p class="sub-text">Will you be my friends forever?</p>

      <div class="button-zone" id="btnZone">
        <button class="btn" id="yesBtn" onclick="goToPage2()">YES! ❤️</button>
        <button class="btn" id="noBtn">NO 😜</button>
      </div>
    </div>

    <!-- PAGE 2 -->
    <div id="page2">
      <!-- Friendship Quote -->
      <div class="quote-box">
        "Friendship is not about who you've known the longest... It's about who came into your life, said 'I'm here for you,' and proved it." ✨
      </div>

      <!-- 5 PHOTOS CIRCLE WRAPPER AROUND WISH -->
      <div class="circle-wrapper">
        
        <!-- Center Wish -->
        <div class="center-wish">
          Happy Friendship Day, Gonzo,Ammu! 💖
        </div>

        <!-- Slot 0 (Top Center) -->
        <div class="photo-slot slot-0" id="slot-0"></div>

        <!-- Slot 1 (Top Right) -->
        <div class="photo-slot slot-1" id="slot-1"></div>

        <!-- Slot 2 (Bottom Right) -->
        <div class="photo-slot slot-2" id="slot-2"></div>

        <!-- Slot 3 (Bottom Left) -->
        <div class="photo-slot slot-3" id="slot-3"></div>

        <!-- Slot 4 (Top Left) -->
        <div class="photo-slot slot-4" id="slot-4"></div>

      </div>
    </div>
  </div>

  <!-- LIGHTBOX FULLSCREEN MODAL -->
  <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
    <div class="lightbox-tag" id="lightboxTag">Added by Ammu</div>
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <div class="close-lightbox" onclick="closeLightbox()">&times;</div>
      <img id="lightboxImg" src="" alt="Full view memory" />
    </div>
  </div>

  <script>
    /* 1. PINK RAIN MATRIX ANIMATION */
    const canvas = document.getElementById('pinkRainCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const pinkChars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ💕✨🌸💖';
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawPinkRain() {
      ctx.fillStyle = 'rgba(5, 2, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f472b6';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = pinkChars.charAt(Math.floor(Math.random() * pinkChars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawPinkRain, 33);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    /* 2. CONSTANTLY MOVING 'NO' BUTTON LOGIC */
    const noBtn = document.getElementById('noBtn');
    let t = 0;

    function moveNoBtnConstantly() {
      const zone = document.getElementById('btnZone');
      const zoneRect = zone.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();

      const maxX = (zoneRect.width - noRect.width) / 2 - 20;
      const maxY = (zoneRect.height - noRect.height) / 2 - 20;

      t += 0.035;
      const x = Math.sin(t) * maxX;
      const y = Math.sin(t * 2) * maxY;

      const centerX = zoneRect.width / 2 - noRect.width / 2;
      const centerY = zoneRect.height / 2 - noRect.height / 2;

      noBtn.style.left = `${centerX + x}px`;
      noBtn.style.top = `${centerY + y}px`;

      requestAnimationFrame(moveNoBtnConstantly);
    }

    window.addEventListener('load', () => {
      moveNoBtnConstantly();
    });

    /* 3. SWITCH TO PAGE 2 & CONFETTI */
    function goToPage2() {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';

      confetti({
        particleCount: 160,
        spread: 90,
        origin: { y: 0.5 },
        colors: ['#f472b6', '#ec4899', '#ffffff']
      });

      renderPhotos();
    }

    /* 4. PRE-SET DIRECT IMGBB IMAGE LINKS */
    const photoMemories = [
      {
        // Slot 0 (Top Center): Childhood Photo
        imgSrc: "https://i.ibb.co/BHgQWJsh/1000093707.jpg",
        addedBy: "Ammu"
      },
      {
        // Slot 1 (Top Right): Holding Flag & Medals
        imgSrc: "https://i.ibb.co/V0g32VQ9/1000093709.jpg",
        addedBy: "Gonzo"
      },
      {
        // Slot 2 (Bottom Right): Butterfly Mural
        imgSrc: "https://i.ibb.co/TxxGBB9j/1000093713.jpg",
        addedBy: "Ammu"
      },
      {
        // Slot 3 (Bottom Left): Mirror Selfie
        imgSrc: "https://i.ibb.co/Xx4ZWrbj/1000093715.jpg",
        addedBy: "Gonzo"
      },
      {
        // Slot 4 (Top Left): 4-Grid Photo Collage
        imgSrc: "https://i.ibb.co/mrT1nTYR/1000093790.jpg",
        addedBy: "Ammu"
      }
    ];

    function renderPhotos() {
      for (let i = 0; i < 5; i++) {
        const slotEl = document.getElementById(`slot-${i}`);
        const photo = photoMemories[i];
        slotEl.innerHTML = `<img src="${photo.imgSrc}" alt="Memory with Gonzo,Ammu" onclick="openLightbox('${photo.imgSrc}', '${photo.addedBy}')" />`;
      }
    }

    /* 5. LIGHTBOX MODAL FUNCTIONS */
    function openLightbox(imgSrc, addedBy) {
      const modal = document.getElementById('lightboxModal');
      const modalImg = document.getElementById('lightboxImg');
      const modalTag = document.getElementById('lightboxTag');

      modalImg.src = imgSrc;
      modalTag.innerText = `Added by ${addedBy} ✨`;
      modal.classList.add('active');
    }

    function closeLightbox() {
      const modal = document.getElementById('lightboxModal');
      modal.classList.remove('active');
    }
  </script>
</body>
</html>
